<div class="login-wrap">
  <div class="card shadow-sm login-card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-flower2 text-success display-5"></i>
        <h1 class="h4 mt-2 mb-0">{{.appName}}</h1>
        <div class="text-muted small">Masuk untuk memantau greenhouse</div>
      </div>

      {{if .success}}<div class="alert alert-success py-2">{{.success}}</div>{{end}}
      {{if .error}}<div class="alert alert-danger py-2">{{.error}}</div>{{end}}

      <form method="post" action="/login" novalidate>
        <input type="hidden" name="_token" value="{{.csrfToken}}">

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" value="{{.old.Email}}"
                 class="form-control {{if .errors.email}}is-invalid{{end}}" autofocus required>
          {{if .errors.email}}<div class="invalid-feedback">{{.errors.email}}</div>{{end}}
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password"
                 class="form-control {{if .errors.password}}is-invalid{{end}}" required>
          {{if .errors.password}}<div class="invalid-feedback">{{.errors.password}}</div>{{end}}
        </div>

        <button type="submit" class="btn btn-success w-100">Masuk</button>
      </form>
    </div>
  </div>
</div>
